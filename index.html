<!DOCTYPE html>
<html lang="tg" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<titleЮ>Девор — Бозори ройгони эълонҳои Тоҷикистон</titleЮ
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --brand:#A62626; --brand-h:#8E1F1F; --brand-tint:rgba(166,38,38,.08);
  --bg:#FFFFFF; --surface:#F5F5F5; --hover:#FAFAFA; --hair:#E6E6E6;
  --text:#212121; --text2:#707070; --muted:#9E9E9E; --success:#1B873F;
}
[data-theme="dark"]{
  --bg:#121212; --surface:#1E1E1E; --hover:#232323; --hair:#2E2E2E;
  --text:#F1F1F1; --text2:#A0A0A0; --muted:#A0A0A0; --brand:#D94141; --brand-h:#B53636; --brand-tint:rgba(217,65,65,.12);
}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter','Noto Sans',sans-serif}
body{background:var(--bg);color:var(--text);font-size:14px}
button{cursor:pointer;border:none;background:none;color:inherit;font:inherit}
input,select,textarea{font:inherit;color:var(--text);background:var(--surface);border:1px solid var(--hair);border-radius:4px;padding:10px 12px;outline:none;width:100%}
input:focus,textarea:focus{border-color:var(--brand)}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:var(--hair);border-radius:8px}

/* ============ HEADER ============ */
header{position:sticky;top:0;z-index:100;background:var(--bg);border-bottom:1px solid var(--hair)}
.hdr-in{display:flex;align-items:center;gap:10px;padding:10px 16px;max-width:1400px;margin:auto;height:64px}
.logo{display:flex;align-items:center;gap:8px;font-weight:700;font-size:20px;color:var(--brand);white-space:nowrap}
.city-btn,.cat-btn{display:flex;align-items:center;gap:6px;padding:8px 12px;border-radius:4px;background:var(--surface);color:var(--text);font-weight:600;font-size:13px;white-space:nowrap}
.city-btn:hover,.cat-btn:hover{background:var(--hover)}
.search-wrap{flex:1;position:relative;min-width:120px}
.search-wrap input{background:var(--surface);border:1px solid var(--hair);border-radius:4px;padding:9px 34px 9px 12px}
.s-clear{position:absolute;right:8px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:16px}
.hdr-right{display:flex;align-items:center;gap:8px;margin-left:auto}
.hbtn{position:relative;padding:8px 10px;border-radius:4px;color:var(--text2);font-weight:600;font-size:13px}
.hbtn:hover{background:var(--hover);color:var(--text)}
.badge{position:absolute;top:0;right:0;background:var(--brand);color:#fff;font-size:10px;font-weight:700;border-radius:50%;min-width:16px;height:16px;display:flex;align-items:center;justify-content:center;padding:0 3px}
.post-btn{background:var(--brand);color:#fff;font-weight:700;padding:10px 16px;border-radius:4px;font-size:13px}
.post-btn:hover{background:var(--brand-h)}

/* ============ LAYOUT ============ */
.layout{display:flex;max-width:1400px;margin:auto;gap:20px;padding:16px}
aside{width:280px;flex-shrink:0;position:sticky;top:80px;align-self:flex-start;max-height:calc(100vh - 96px);overflow-y:auto}
main{flex:1;min-width:0}
@media(max-width:900px){
  aside{position:fixed;left:-300px;top:0;bottom:0;z-index:200;background:var(--bg);max-height:none;transition:left .25s;padding:16px;box-shadow:2px 0 12px rgba(0,0,0,.15)}
  aside.open{left:0}
  .cat-btn{display:none}
  .hbtn span{display:none}
  .layout{padding:10px}
}
.aside-h{display:none;font-size:16px;font-weight:700;margin-bottom:8px}
@media(max-width:900px){.aside-h{display:block}}
.foot{color:var(--muted);font-size:11.5px;text-align:center;padding:14px 0;border-top:1px solid var(--hair);margin-top:12px}

/* ============ SIDEBAR ============ */
.side-title{font-weight:700;font-size:14px;margin:6px 0 8px;display:flex;align-items:center;justify-content:space-between}
.back-btn{color:var(--brand);font-size:12px;font-weight:600}
.cat-item{display:flex;align-items:center;gap:8px;padding:9px 10px;border-radius:4px;font-size:13.5px;color:var(--text)}
.cat-item:hover{background:var(--hover)}
.cat-item.active{color:var(--brand);background:var(--brand-tint);font-weight:600}
.cat-item .cnt{margin-left:auto;color:var(--muted);font-size:11.5px}
.cat-item .ic{width:16px;text-align:center;color:var(--text2)}
.acc-h{display:flex;align-items:center;justify-content:space-between;padding:11px 4px;border-bottom:1px solid var(--hair);font-weight:600;font-size:13.5px;user-select:none}
.acc-h .chev{transition:transform .2s;color:var(--muted)}
.acc.open .chev{transform:rotate(180deg)}
.acc-b{max-height:0;overflow:hidden;transition:max-height .3s ease}
.acc.open .acc-b{max-height:600px;padding:8px 4px}
.chk{display:flex;align-items:center;gap:8px;padding:6px 4px;font-size:13px;color:var(--text2)}
.chk input{width:auto}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.fchip{border:1px solid var(--hair);border-radius:16px;padding:5px 11px;font-size:12px;background:var(--bg);color:var(--text)}
.fchip.sel{background:var(--brand-tint);border-color:var(--brand);color:var(--brand);font-weight:600}
.sw-row{display:flex;align-items:center;justify-content:space-between;padding:7px 4px;font-size:13px;color:var(--text2)}
.switch{position:relative;width:36px;height:20px;background:var(--hair);border-radius:10px;transition:.2s;flex-shrink:0}
.switch.on{background:var(--brand)}
.switch::after{content:'';position:absolute;top:2px;left:2px;width:16px;height:16px;background:#fff;border-radius:50%;transition:.2s}
.switch.on::after{left:18px}
.reset-btn{width:100%;margin-top:12px;padding:11px;border:1px solid var(--hair);border-radius:4px;font-weight:600;color:var(--brand);background:var(--bg)}
.reset-btn:hover{background:var(--brand-tint)}

/* ============ FEED ============ */
.feed-bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.crumb{color:var(--muted);font-size:12px}
.fchip-x{border:1px solid var(--brand);color:var(--brand);border-radius:16px;padding:4px 10px;font-size:12px;background:var(--brand-tint);display:flex;gap:6px;align-items:center}
select.sort{width:auto;padding:7px 10px;font-size:12.5px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:10px}
@media(max-width:768px){.grid{grid-template-columns:1fr}}
.ad-card{display:flex;justify-content:space-between;gap:12px;border:1px solid var(--hair);border-radius:4px;padding:14px;background:var(--bg)}
.ad-card:hover{background:var(--hover)}
.ad-l{flex:1;display:flex;flex-direction:column;min-width:0}
.ad-t{font-size:15px;font-weight:500;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ad-s{font-size:12.5px;color:var(--text2);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ad-p{font-size:15px;font-weight:600;margin-top:auto;padding-top:6px}
.ad-p.free{color:var(--success)}
.ad-m{font-size:11.5px;color:var(--muted);margin-top:4px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.tag{background:var(--brand-tint);color:var(--brand);font-size:10.5px;padding:1px 6px;border-radius:3px;font-weight:600}
.tag.org{background:rgba(255,152,0,.14);color:#E65100}
.ad-r{width:136px;height:136px;flex-shrink:0;position:relative;border-radius:4px;overflow:hidden}
.thumb{width:100%;height:100%;display:flex;align-items:center;justify-content:center;position:relative}
.ph-badge{position:absolute;bottom:6px;right:6px;background:rgba(0,0,0,.5);color:#fff;font-size:10.5px;padding:2px 7px;border-radius:10px}
.heart{position:absolute;top:6px;right:6px;width:26px;height:26px;background:rgba(255,255,255,.85);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;color:#707070}
.heart.on{color:var(--brand)}
.map-btn{position:fixed;bottom:24px;right:24px;z-index:90;background:var(--brand);color:#fff;padding:12px 18px;border-radius:24px;font-weight:700;box-shadow:0 4px 14px rgba(0,0,0,.25);display:flex;gap:8px;align-items:center}
.empty{text-align:center;color:var(--muted);padding:60px 20px}

/* ============ MODALS ============ */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:300;display:none;align-items:flex-start;justify-content:center;overflow-y:auto;padding:40px 16px}
.ov.open{display:flex}
.modal{background:var(--bg);border-radius:8px;max-width:640px;width:100%;padding:24px;position:relative;box-shadow:0 12px 40px rgba(0,0,0,.3)}
.modal.wide{max-width:860px}
.m-close{position:absolute;top:14px;right:14px;font-size:20px;color:var(--muted);width:32px;height:32px;border-radius:50%}
.m-close:hover{background:var(--hover)}
.m-title{font-size:19px;font-weight:700;margin-bottom:14px}
.spec-t{width:100%;border-collapse:collapse;border:1px solid var(--hair)}
.spec-t td{padding:9px 12px;border-bottom:1px solid var(--hair);font-size:13.5px}
.spec-t tr:last-child td{border-bottom:none}
.spec-t td:first-child{color:var(--text2);width:45%}
.spec-t td:last-child{text-align:right;font-weight:500}
.safety{background:var(--brand-tint);border:1px solid var(--brand);border-radius:8px;padding:14px;margin-top:16px;font-size:13px;line-height:1.7}
.safety b{color:var(--brand)}
.det-bar{display:flex;gap:8px;margin-top:20px}
.det-bar button{flex:1;padding:13px;border-radius:4px;font-weight:700;font-size:14px}
.btn-admin-del{width:100%;margin-top:10px;background:var(--brand);color:#fff;padding:13px;border-radius:4px;font-weight:700;font-size:14px;letter-spacing:.2px}
.btn-admin-del:hover{opacity:.9}
.btn-out{border:1px solid var(--brand);color:var(--brand);background:var(--bg)}
.btn-fill{background:var(--brand);color:#fff}
.btn-fill:hover{background:var(--brand-h)}
.gal{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.gal .g{width:64px;height:64px;border-radius:4px;overflow:hidden;border:2px solid transparent}
.gal .g.sel{border-color:var(--brand)}
.wiz-nav{display:flex;gap:8px;margin-top:18px}
.wiz-nav button{flex:1;padding:12px;border-radius:4px;font-weight:700}
.two{display:flex;gap:8px}
.two>*{flex:1}
.tog3{display:flex;gap:6px;margin:8px 0}
.tog3 button{flex:1;padding:9px;border:1px solid var(--hair);border-radius:4px;font-size:12.5px;background:var(--bg);color:var(--text2)}
.tog3 button.on{border-color:var(--brand);color:var(--brand);background:var(--brand-tint);font-weight:700}
.priv-note{background:var(--brand-tint);border-radius:8px;padding:12px;font-size:12px;color:var(--text2);line-height:1.7;margin-top:10px}
.free-note{background:rgba(27,135,63,.08);color:var(--success);border-radius:8px;padding:12px;font-size:13px;font-weight:600;margin-top:10px}

/* ============ CITY MODAL / DRAWERS ============ */
.city-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:6px}
.city-it{padding:10px 12px;border:1px solid var(--hair);border-radius:4px;font-size:13.5px}
.city-it.sel{border-color:var(--brand);color:var(--brand);background:var(--brand-tint);font-weight:700}
.city-it:hover{background:var(--hover)}

/* ============ CHAT ============ */
.chat-split{display:flex;height:520px;border:1px solid var(--hair);border-radius:8px;overflow:hidden}
.chat-list{width:220px;border-right:1px solid var(--hair);overflow-y:auto;flex-shrink:0}
.chat-msgs{flex:1;display:flex;flex-direction:column}
.chat-h{padding:12px;border-bottom:1px solid var(--hair);font-weight:600;font-size:13.5px;display:flex;align-items:center;gap:10px}
.chat-b{flex:1;overflow-y:auto;padding:12px}
.msg{max-width:75%;padding:9px 13px;border-radius:16px;margin:4px 0;font-size:13.5px;line-height:1.4}
.msg.me{background:var(--brand);color:#fff;margin-left:auto;border-bottom-right-radius:4px}
.msg.them{background:var(--surface);border-bottom-left-radius:4px}
.qchips{display:flex;gap:6px;padding:8px 12px;border-top:1px solid var(--hair);flex-wrap:wrap}
.qchips button{border:1px solid var(--brand);color:var(--brand);background:var(--brand-tint);border-radius:16px;padding:5px 11px;font-size:12px}
.chat-in{display:flex;gap:8px;padding:10px 12px;border-top:1px solid var(--hair)}
.chat-it{display:flex;gap:10px;padding:10px;border-bottom:1px solid var(--hair);align-items:center}
.chat-it.sel{background:var(--hover)}
.chat-it .un{background:var(--brand);color:#fff;font-size:11px;border-radius:10px;padding:1px 7px;margin-left:auto}

/* ============ MAP VIEW ============ */
.map-box{position:relative;height:560px;border:1px solid var(--hair);border-radius:8px;overflow:hidden}
.map-svg{position:absolute;inset:0;width:100%;height:100%}
.pin{position:absolute;background:#fff;color:var(--brand);font-weight:700;font-size:12px;padding:5px 11px;border-radius:16px;box-shadow:0 2px 8px rgba(0,0,0,.25);border:1px solid var(--hair)}

/* ============ SUPER-ADMIN GATE / SCHEMA BUILDER ============ */
.logo{position:relative}
.tapdots{font-size:9px;color:var(--brand);letter-spacing:2px;margin-left:4px}
.logo-emblem{width:30px;height:30px;border-radius:7px;overflow:hidden;flex-shrink:0}
.logo-emblem svg{width:100%;height:100%;display:block}
.ota{position:fixed;top:0;left:0;right:0;z-index:400;background:var(--success);color:#fff;padding:10px 16px;display:flex;gap:10px;align-items:center;font-size:13px;font-weight:600;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.ota button{background:rgba(255,255,255,.2);color:#fff;padding:6px 14px;border-radius:4px;font-weight:700}
.bannerRow{display:flex;gap:8px;overflow-x:auto;margin-bottom:10px}
.bannerCard{min-width:240px;padding:12px 14px;border-radius:8px;color:#fff;display:flex;gap:10px;align-items:center;font-weight:700;font-size:13.5px}
.bannerCard small{display:block;font-weight:500;font-size:11.5px;opacity:.85}
.adm-row{display:flex;align-items:center;gap:8px;padding:7px 8px;border-bottom:1px solid var(--hair);font-size:13px}
.adm-row .grow{flex:1;min-width:0}
.adm-row .ib{padding:4px 8px;border-radius:4px;font-size:12px;background:var(--surface);white-space:nowrap}
.adm-row .ib:hover{background:var(--hover)}
.adm-row .ib.dan{color:var(--brand)}
.adm-note{font-size:11.5px;color:var(--muted);margin:8px 0;line-height:1.6}
.panel-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.panel-tabs button{border:1px solid var(--hair);border-radius:16px;padding:6px 12px;font-size:12.5px;background:var(--bg);color:var(--text2)}
.panel-tabs button.on{border-color:var(--brand);color:var(--brand);background:var(--brand-tint);font-weight:700}
.sw{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.swb{width:30px;height:30px;border-radius:50%;border:2px solid transparent;flex-shrink:0}
.swb.on{border-color:var(--text)}
.emb{width:44px;height:44px;border-radius:8px;background:linear-gradient(135deg,var(--brand),var(--brand-h));display:flex;align-items:center;justify-content:center;font-size:20px;border:2px solid transparent}
.emb.on{border-color:var(--text)}
.lock-note{background:var(--brand-tint);color:var(--brand);border:1px solid var(--brand);border-radius:8px;padding:10px 12px;font-size:12.5px;font-weight:700;margin-bottom:10px}

/* ============ CINEMATIC SPLASH (Explosive Entrance) ============ */
.splash{position:fixed;inset:0;z-index:1000;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(1100px 700px at 50% 28%,#5a1616 0%,#A62626 45%,#170404 100%);
  transition:transform .75s cubic-bezier(.22,1,.36,1),opacity .75s ease,filter .75s ease;will-change:transform,opacity,filter}
.splash.explode{transform:scale(2.7);opacity:0;filter:blur(16px);pointer-events:none}
.splash-core{text-align:center;position:relative;z-index:2}
.splash-icon{width:96px;height:96px;margin:0 auto;border-radius:22px;overflow:hidden;
  box-shadow:0 24px 70px rgba(0,0,0,.5),0 0 40px rgba(255,255,255,.12);
  animation:floatPulse 2.6s ease-in-out infinite}
.splash-icon svg{width:100%;height:100%;display:block}
@keyframes floatPulse{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-10px) scale(1.05)}}
.splash-title{font-size:44px;font-weight:800;color:#fff;letter-spacing:8px;margin-top:18px;text-shadow:0 4px 30px rgba(0,0,0,.4)}
.splash-sub{color:rgba(255,255,255,.85);font-size:14px;margin-top:8px;letter-spacing:.4px}
.splash-btn{margin-top:28px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.4);color:#fff;
  padding:13px 30px;border-radius:26px;font-weight:700;font-size:15px;backdrop-filter:blur(6px);
  animation:glowPulse 2s ease-in-out infinite;transition:transform .15s ease}
.splash-btn:hover{transform:scale(1.04)}
.splash-btn:active{transform:scale(.96)}
@keyframes glowPulse{0%,100%{box-shadow:0 0 18px rgba(255,255,255,.22),inset 0 0 10px rgba(255,255,255,.08)}
  50%{box-shadow:0 0 38px rgba(255,255,255,.5),inset 0 0 14px rgba(255,255,255,.14)}}
/* ---- Варақҳои эълони коғазӣ дар гирди маркази splash (ороїш) ---- */
.paper{position:absolute;width:112px;height:132px;padding:12px 10px;border-radius:6px;z-index:1;pointer-events:none;
  box-shadow:0 12px 26px rgba(0,0,0,.38),0 2px 6px rgba(0,0,0,.22);
  animation:paperFloat var(--dur,6s) ease-in-out infinite alternate;will-change:transform;overflow:hidden}
.paper::before{content:'';position:absolute;top:0;right:0;border-style:solid;border-width:0 18px 18px 0;
  border-color:transparent rgba(0,0,0,.16) transparent transparent}
.paper .pw{font-weight:800;font-size:13px;color:#1F2937;line-height:1.2}
.paper .pl{height:5px;border-radius:3px;background:rgba(31,41,55,.22);margin-top:6px}
.paper .pl.s{width:70%}
.paper .pnum{font-size:11px;font-weight:700;color:#334155;margin-top:9px;letter-spacing:.6px}
@keyframes paperFloat{0%{transform:translateY(0) rotate(var(--rot,0deg))}
  100%{transform:translateY(-16px) rotate(calc(var(--rot,0deg) + 3deg))}}
@media(max-width:640px){.paper{width:74px;height:88px;padding:8px}.paper .pw{font-size:10px}
  .paper .pl{height:4px;margin-top:4px}.paper .pnum{font-size:9px;margin-top:5px}}
.shard{position:absolute;left:50%;top:50%;width:22px;height:22px;border-radius:4px;z-index:1;
  background:linear-gradient(135deg,#D94141,#7F1D1D);opacity:0;will-change:transform,opacity}
.splash.explode .shard{animation:shardFly .8s cubic-bezier(.22,1,.36,1) forwards}
@keyframes shardFly{0%{opacity:1;transform:translate(-50%,-50%) rotate(0) scale(1)}
  100%{opacity:0;transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) rotate(var(--rot)) scale(.35)}}
body.app-zoom .layout,body.app-zoom header{animation:appIn .8s cubic-bezier(.22,1,.36,1)}
@keyframes appIn{0%{transform:scale(.94);opacity:.4}100%{transform:scale(1);opacity:1}}
.app-foot{text-align:center;padding:18px;border-top:1px solid var(--hair);color:var(--muted);font-size:12.5px;margin-top:16px}
.app-foot .sub{font-size:11px;opacity:.75;margin-top:4px}

/* ============ TOAST ============ */
#toasts{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:500;display:flex;flex-direction:column;gap:8px;align-items:center}
.toast{background:var(--text);color:var(--bg);padding:11px 20px;border-radius:24px;font-size:13.5px;font-weight:600;box-shadow:0 6px 20px rgba(0,0,0,.3);animation:tin .25s ease}
@keyframes tin{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.mob-tabs{display:none;position:fixed;bottom:0;left:0;right:0;background:var(--bg);border-top:1px solid var(--hair);z-index:150}
@media(max-width:900px){.mob-tabs{display:flex}body{padding-bottom:58px}}
.mob-tabs button{flex:1;padding:9px 0;font-size:10.5px;color:var(--text2);display:flex;flex-direction:column;align-items:center;gap:2px}
.mob-tabs button.on{color:var(--brand)}
.mob-tabs button svg{width:20px;height:20px}
@media (max-width: 768px) {
  html, body {
    overflow-x: hidden;
    max-width: 100%;
  }

  .layout,
  .main-layout,
  .container,
  .wrapper,
  .sidebar,
  .aside,
  .filters-panel {
    width: 100% !important;
    max-width: 100% !important;
    min-width: 0 !important;
    flex-direction: column !important;
    box-sizing: border-box;
  }

  .ads-grid,
  .listings-grid,
  .cards-grid,
  .grid {
    display: grid !important;

const S={
  ads:seedAds(), city:'Душанбе', q:'', cat:null, path:[], districts:new Set(),
  min:null, max:null, freeOnly:false, photoOnly:false, exOnly:false, urgOnly:false,
  sort:'new', mapView:false, bookmarks:JSON.parse(localStorage.getItem('dv_bk')||'[]'),
  recent:JSON.parse(localStorage.getItem('dv_rc')||'[]'),
  myAds:JSON.parse(localStorage.getItem('dv_my')||'[]'),
  chats:JSON.parse(localStorage.getItem('dv_ch')||'[]'),
  theme:localStorage.getItem('dv_th')||'light'
};
const QUICK=['Салом, ҳоло ҳам ҳаст?','Нархи охираш чанд?','Дар куҷо дидан мумкин?'];
function save(){localStorage.setItem('dv_bk',JSON.stringify(S.bookmarks));localStorage.setItem('dv_rc',JSON.stringify(S.recent));localStorage.setItem('dv_my',JSON.stringify(S.myAds));localStorage.setItem('dv_ch',JSON.stringify(S.chats));localStorage.setItem('dv_th',S.theme);}
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>n===null?'Ройгон':n.toString().replace(/\B(?=(\d{3})+(?!\d))/g,' ')+' с.';
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.getElementById('toasts').appendChild(t);setTimeout(()=>t.remove(),2600);}
function maskPhone(p){const d=p.replace(/\D/g,'');return '+992 '+d.slice(3,5)+' *** ** '+d.slice(-2);}

/* ==================== THUMBNAIL (акси воқеӣ ё gradient SVG, офлайн) ==================== */
function thumbSVG(ad,size){
  const [c1,c2]=(ad.g||'#A62626,#D94141').split(',');
  // Ҳифзи ҳаримӣ: дар badge ТАНҲО шумораи аксҳо — ҳеҷ рақами телефон НЕСТ
  const n=(ad.photos&&ad.photos.length)||(typeof ad.ph==='number'?ad.ph:3);
  const inner=(ad.photos&&ad.photos[0])
    ?`<img src="${ad.photos[0]}" alt="" style="width:100%;height:100%;object-fit:cover;display:block">`
    :ad.ic;
  return `<div class="thumb" style="background:linear-gradient(135deg,${c1},${c2});font-size:${size===136?44:28}px">${inner}
    ${size===136?`<span class="ph-badge">📷 ${n}</span><button class="heart ${S.bookmarks.includes(ad.id)?'on':''}" onclick="event.stopPropagation();toggleBk('${ad.id}')">♥</button>`:''}</div>`;
}

/* ==================== FILTER ==================== */
function filtered(){
  let r=S.ads.concat(S.myAds);
  if(S.cat) r=r.filter(a=>a.cp.startsWith(S.cat));
  if(S.q){const q=S.q.toLowerCase();r=r.filter(a=>(a.t+' '+a.sp+' '+a.d+' '+JSON.stringify(a.st)).toLowerCase().includes(q));}
  if(S.districts.size) r=r.filter(a=>S.districts.has(a.d));
  if(S.min!==null) r=r.filter(a=>a.pr!==null&&a.pr>=S.min);
  if(S.max!==null) r=r.filter(a=>a.pr!==null&&a.pr<=S.max);
  if(S.freeOnly) r=r.filter(a=>a.fr||a.pr===null);
  if(S.photoOnly) r=r.filter(a=>(a.ph||3)>2);
  if(S.exOnly) r=r.filter(a=>a.ex);
  if(S.urgOnly) r=r.filter(a=>a.ur);
  if(S.sort==='cheap') r=[...r].sort((a,b)=>(a.pr??-1)-(b.pr??-1));
  else if(S.sort==='exp') r=[...r].sort((a,b)=>(b.pr??-1)-(a.pr??-1));
  return r;
}

/* ==================== RENDER FEED ==================== */
function renderFeed(){
  const feed=document.getElementById('feed'),r=filtered();
  feed.innerHTML=r.length?r.map(a=>`
    <div class="ad-card" onclick="openDetail('${a.id}')">
      <div class="ad-l">
        <div class="ad-t">${esc(a.t)}</div>
        <div class="ad-s">${esc(a.sp)}</div>
        <div class="ad-p ${a.pr===null?'free':''}">${fmt(a.pr)}${a.pr===null?'':' • Сӯзишворӣ'}</div>
        <div class="ad-m">${esc(a.time)} дар ${esc(a.d)}${a.ex?'<span class="tag">Мубодила</span>':''}${a.ur?'<span class="tag org">Фаврӣ</span>':''}</div>
      </div>
      <div class="ad-r">${thumbSVG(a,136)}</div>
    </div>`).join(''):'<div class="empty"><div style="font-size:44px">🔍</div>Эълоне ёфт нашуд</div>';
  renderBar();renderPins();
}
function renderBar(){
  const chips=[];
  if(S.cat) chips.push(`<button class="fchip-x" onclick="setCat(null)">${esc(S.cat.split('/').pop())} ✕</button>`);
  for(const d of S.districts) chips.push(`<button class="fchip-x" onclick="S.districts.delete('${esc(d)}');renderAll()">${esc(d)} ✕</button>`);
  if(S.freeOnly) chips.push('<button class="fchip-x" onclick="S.freeOnly=false;renderAll()">Танҳо ройгон ✕</button>');
  if(S.exOnly) chips.push('<button class="fchip-x" onclick="S.exOnly=false;renderAll()">Мубодила ✕</button>');
  document.getElementById('feedBar').innerHTML=
    `<span class="crumb">${esc(S.city)}${S.cat?' → '+esc(S.cat):''}</span> ${chips.join(' ')}
     <select class="sort" onchange="S.sort=this.value;renderFeed()" style="margin-left:auto">
       <option value="new" ${S.sort==='new'?'selected':''}>Навтарин</option>
       <option value="cheap" ${S.sort==='cheap'?'selected':''}>Арзонтарин</option>
       <option value="exp" ${S.sort==='exp'?'selected':''}>Қиматтарин</option>
     </select>`;
}
function renderPins(){
  const r=filtered().slice(0,9),box=document.getElementById('pins');
  box.innerHTML=r.map((a,i)=>`<button class="pin" style="left:${8+(i%3)*30}%;top:${12+Math.floor(i/3)*26}%" onclick="openDetail('${a.id}')">${fmt(a.pr)}</button>`).join('');
}
function toggleMap(){
  S.mapView=!S.mapView;
  document.getElementById('feed').style.display=S.mapView?'none':'grid';
  document.getElementById('mapView').style.display=S.mapView?'block':'none';
  document.getElementById('mapToggle').innerHTML=S.mapView?'☰ Рӯйхат':'🗺️ Харита';
}

/* ==================== SIDEBAR ==================== */
function catCount(name){return S.ads.concat(S.myAds).filter(a=>a.cp.includes(name)).length;}
function nodesAt(){let n=SCHEMA.cats;for(const seg of S.path){const f=n.find(x=>x.n===seg);if(!f)return n;n=f.ch||[];}return n;}
function renderCats(){
  const ns=nodesAt().filter(n=>!n.h),tree=document.getElementById('catTree');
  tree.innerHTML=`<div class="side-title">${S.path.length?'<button class="back-btn" onclick="S.path.pop();renderAll()">← Ҳамаи бандҳо</button>':'Бандҳо'}<span></span></div>`+
   ns.map(n=>`<div class="cat-item ${S.cat&&S.cat.split('/').pop()===n.n?'active':''}" onclick="clickCat('${esc(n.n)}')">
     <span class="ic">${n.ic||(S.path.length?'•':'▦')}</span><span>${esc(n.n)}</span>
     <span class="cnt">${catCount(n.n)}</span>${n.ch?'<span>›</span>':''}</div>`).join('');
}
function clickCat(name){
  const ns=nodesAt(),node=ns.find(x=>x.n===name);
  if(!node)return;
  if(node.ch){S.path.push(name);renderAll();return;}
  const root=S.path[0]||name;
  setCat(root);S.path=[];
}
function setCat(c){S.cat=c;renderAll();}

}

     <div class="two" style="margin-top:6px"><input type="number" placeholder="Масоҳат: Аз м²"><input type="number" placeholder="То м²"></div>
     <div class="sw-row"><span>Насия</span><div class="switch" onclick="this.classList.toggle('on')"></div></div>`);
  if(c.startsWith('нақлиёт'))
   return acc('dm','🚗 Филтрҳои нақлиёт',`<div class="two"><input type="number" placeholder="Сол: Аз"><input type="number" placeholder="То"></div>
     <div class="chips" style="margin-top:6px">${['Седан','Хэтчбек','Универсал','Ҳамаҷогард','Кроссовер','Пикап','Минивен','Фургон','Кабриолет','Купе','Лифтбэк'].map(k=>`<button class="fchip" onclick="toast('Кузов: ${k}')">${k}</button>`).join('')}</div>
     <div class="chips" style="margin-top:6px">${['Механикӣ','Автоматикӣ','Вариатор','Робот'].map(k=>`<button class="fchip" onclick="toast('Қуттӣ: ${k}')">${k}</button>`).join('')}</div>
     <div class="chips" style="margin-top:6px">${['Бензин','Бензин + газ','Газ','Дизел','Гибрид','Электромобил'].map(k=>`<button class="fchip" onclick="toast('Сӯзишворӣ: ${k}')">${k}</button>`).join('')}</div>`);
  if(isJobCat(S.cat)){
   const sch=(fieldG('schedule')||{v:[]}).v, exp=(fieldG('experience')||{v:[]}).v;
   return acc('dm','💼 Филтрҳои кор',`<div class="two"><input type="number" placeholder="Маош: Аз (с.)"><input type="number" placeholder="То (с.)"></div>
     <div class="chips" style="margin-top:6px">${sch.map(k=>`<button class="fchip" onclick="toast('Реҷа: ${esc(k)}')">${esc(k)}</button>`).join('')}</div>
     <div class="chips" style="margin-top:6px">${exp.map(k=>`<button class="fchip" onclick="toast('Таҷриба: ${esc(k)}')">${esc(k)}</button>`).join('')}</div>`);
  }
  if(c.startsWith('телефон')||c.startsWith('компютер')||c.startsWith('электрон')||c.startsWith('олами')){
   const cond=(fieldG('condition')||{v:['Нав','Дар ҳолати хуб','Истифодашуда']}).v;
   return acc('dm','📱 Филтрҳои ҳолат',`<div class="chips">${cond.map(k=>`<button class="fchip" onclick="toast('Ҳолат: ${esc(k)}')">${esc(k)}</button>`).join('')}</div>
     <div class="sw-row" style="margin-top:6px"><span>IMEI санҷидашуда</span><div class="switch" onclick="this.classList.toggle('on')"></div></div>`);
  }
  // Майдонҳои динамикӣ-и custom (аз Schema — бемаҳдуд)

/* Тозакунии эълон: DELETE /rest/v1/ads?id=eq.{id} */
async function sbDeleteListing(id) {
  if (!SUPABASE.URL || !SUPABASE.KEY || !id) {
    return false;
  }

    const response = await fetch(endpoint, {
      method: "DELETE",
      headers: {
        "apikey": SUPABASE.KEY,
        "Authorization": `Bearer ${SUPABASE.KEY}`,
        "Content-Type": "application/json",

/* Боркунии эълонҳо: GET /rest/v1/ads?select=* */
async function sbFetchListings() {
  if (!SUPABASE.URL || !SUPABASE.KEY) {
    return [];
  }
  const base = `${SUPABASE.URL}/rest/v1/ads`;
  const headers = {
    "apikey": SUPABASE.KEY,
    "Authorization": `Bearer ${SUPABASE.KEY}`
  };
  try {
    let response = await fetch(`${base}?select=*&order=created_at.desc`, { headers });
    if (!response.ok) {
      response = await fetch(`${base}?select=*`, { headers });
    }
    if (!response.ok) {
      console.warn(`sbFetchListings: сервер ${response.status}`);
      return [];
    }
    const rows = await response.json();
    return rows.map((row, i) => ({
      id: String(row.id ?? `sb${i}`),
      t: row.title ?? "Эълон",
      cp: row.category_path ?? "Дигар",
      sp: row.subtitle ?? "",
      pr: (row.price === null || row.price === undefined) ? null : Number(row.price),
      ic: row.icon ?? "📦",
      g: row.gradient ?? "#A62626,#D94141",
      st: (row.specs && typeof row.specs === "object") ? row.specs : {},
      d: row.district ?? "",
      ph: Array.isArray(row.photos) ? row.photos.length : 3,
      photos: Array.isArray(row.photos) ? row.photos : null,
      ex: !!row.exchange,
      ur: !!row.urgent,
      fr: row.price === null,
      time: row.created_at ? new Date(row.created_at).toLocaleString("tg") : "ҳоло",
      seller: row.seller_name ?? "Supabase",
      sellerId: row.seller_id ?? row.seller_name ?? "seller",
      tel: row.phone ?? row.tel ?? "",
      desc: row.description ?? "",
      city: row.city ?? "Душанбе"
    }));
  } catch (err) {
    console.warn("sbFetchListings: шабака дастрас нест", err);
    return [];
  }
}

/* Нашри эълон: POST /rest/v1/ads (merge-duplicates = upsert) */
async function sbUpsertListing(ad) {
  if (!SUPABASE.URL || !SUPABASE.KEY || !ad) {
    return false;
  }
  try {
    const payload = {
      id: ad.id,
      title: ad.t,
      category_path: ad.cp,
      price: ad.pr,
      district: ad.d,
      city: ad.city,
      description: ad.desc || "",
      photos: Array.isArray(ad.photos) ? ad.photos : [],
      specs: (ad.st && typeof ad.st === "object") ? ad.st : {},
      exchange: !!ad.ex,
      urgent: !!ad.ur,
      icon: ad.ic,
      phone: ad.tel || "",
      seller_name: ad.seller,
      created_at: new Date().toISOString()
    };
    const response = await fetch(`${SUPABASE.URL}/rest/v1/ads`, {
      method: "POST",
      headers: {
        "apikey": SUPABASE.KEY,
        "Authorization": `Bearer ${SUPABASE.KEY}`,
        "Content-Type": "application/json",
        "Prefer": "resolution=merge-duplicates,return=minimal"
      },
      body: JSON.stringify(payload)
    });
    if (!response.ok) {
      console.warn(`sbUpsertListing: сервер ${response.status}`);
      return false;
    }
    return true;
  } catch (err) {
    console.warn("sbUpsertListing: шабака дастрас нест", err);
    return false;
  }
}

/* ---------- STRICT 2+ REAL GALLERY PHOTOS (append, compression, Supabase Storage) ---------- */
function onPhotosPicked(input){
  const files=[...input.files].filter(f=>f&&f.type&&f.type.startsWith('image/'));
  // Reset — то ки интихоби дубории ҳамон файл(ҳо) change-ро дубора фаъол кунад
  input.value='';
  if(!files.length){renderPost();return;}
  pw.photos=Array.isArray(pw.photos)?pw.photos:[]; // APPEND ба массиви ҷорӣ (на иваз)
  let done=0;
  files.forEach(f=>{
    const slot=pw.photos.length; // ҷои нав дар охири массив
    const r=new FileReader();
    r.onload=e=>{
      const img=new Image();
      img.onload=()=>{
        // Compression-и клиентӣ: max 800px, JPEG 0.72 — бе placeholder, танҳо файл-и воқеӣ
        const max=800,sc=Math.min(1,max/Math.max(img.width,img.height));
        const c=document.createElement('canvas');
        c.width=Math.max(1,Math.round(img.width*sc));
        c.height=Math.max(1,Math.round(img.height*sc));
        c.getContext('2d').drawImage(img,0,0,c.width,c.height);
        pw.photos[slot]=c.toDataURL('image/jpeg',.72);
        if(++done===files.length){pw.photos=pw.photos.filter(Boolean);renderPost();}
      };
      img.onerror=()=>{if(++done===files.length){pw.photos=pw.photos.filter(Boolean);renderPost();}};
      img.src=e.target.result;
    };
    r.readAsDataURL(f);
  });
}

let curChat=null;
function myUid(){
  let u=localStorage.getItem('dv_uid');
  if(!u){u='u'+Math.random().toString(36).slice(2,10);localStorage.setItem('dv_uid',u);}
  return u;

async function sbFetchMessages(adId){
  if(!SUPABASE.URL||!SUPABASE.KEY||!adId)return null;
  try{
    const url=`${SUPABASE.URL}/rest/v1/messages?ad_id=eq.${encodeURIComponent(adId)}&order=created_at.asc`;
    const r=await fetch(url,{headers:{"apikey":SUPABASE.KEY,"Authorization":`Bearer ${SUPABASE.KEY}`}});
    if(!r.ok)return null;
    return await r.json();
  }catch(e){return null;}
}
async function sbSendMessage(adId,text,receiverId){
  if(!SUPABASE.URL||!SUPABASE.KEY)return false;
  try{
    const row={ad_id:adId,sender_id:myUid(),receiver_id:receiverId||'seller',text:text};
    const r=await fetch(`${SUPABASE.URL}/rest/v1/messages`,{
      method:'POST',
      headers:{"apikey":SUPABASE.KEY,"Authorization":`Bearer ${SUPABASE.KEY}`,'Content-Type':'application/json','Prefer':'return=minimal'},
      body:JSON.stringify(row)
    });
    return r.ok;
  }catch(e){return false;}
}
function renderChatMessages(c){
  const box=document.getElementById('chatMsgs');
  if(!box)return;
  box.innerHTML=c.msgs.map(m=>`<div class="msg ${m.me?'me':'them'}">${esc(m.txt)}</div>`).join('');
  box.scrollTop=box.scrollHeight;
}
async function loadChatMessages(c,notify){
  const uid=myUid();
  const rows=await sbFetchMessages(c.adId);
  if(!Array.isArray(rows))return;
  const first=c.rawCount===undefined;
  const fresh=first?[]:rows.slice(c.rawCount||0);
  c.rawCount=rows.length;
  c.msgs=rows.map(r=>({me:String(r.sender_id)===uid,txt:String(r.text??'')}));
  save();
  const incoming=fresh.filter(r=>String(r.sender_id)!==uid).length;
  const open=document.getElementById('ovChat').classList.contains('open')&&curChat===c;
  if(open){renderChatMessages(c);c.unread=0;save();updBadge();}
  else if(!first&&incoming>0&&notify){
    c.unread=(c.unread||0)+incoming;
    save();updBadge();
    toast('Паёми нав 💬');
  }
}
function pollChats(){
  if(!SUPABASE.URL||!SUPABASE.KEY||!S.chats.length)return;
  const open=document.getElementById('ovChat').classList.contains('open');
  if(open&&curChat){loadChatMessages(curChat,true);return;}
  S.chats.slice(0,10).forEach(c=>{loadChatMessages(c,true);});
}

         ${c2.unread?`<span class="un">${c2.unread}</span>`:''}</div>`).join('')}</div>

async function sendMsg(txt){
  if(!txt||!txt.trim()||!curChat)return;
  const text=txt.trim();
  const input=document.getElementById('msgIn');

  const ok=await sbSendMessage(curChat.adId,text,curChat.receiverId);
  curChat.msgs.push({me:true,txt:text});
  if(ok)curChat.rawCount=(curChat.rawCount||0)+1;
  save();
  if(document.getElementById('ovChat').classList.contains('open'))renderChatMessages(curChat);

async function sha256Hex(str){
  const h=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(str));
  return [...new Uint8Array(h)].map(x=>x.toString(16).padStart(2,'0')).join('');
}
function randSalt(){const a=new Uint8Array(32);crypto.getRandomValues(a);return btoa(String.fromCharCode(...a));}
const hashWithSalt=(salt,secret)=>sha256Hex(salt+':'+secret);

  if(l.length<4){toast('Логин ҳадди ақал 4 аломат');return;}
  if(p.length<8){toast('Парол ҳадди ақал 8 аломат');return;}
  if(p!==p2){toast('Паролҳо мувофиқ нестанд');return;}
  const salt=randSalt();
  localStorage.setItem(ADMIN_KEY,JSON.stringify({
    s:salt,l:await hashWithSalt(salt,l.toLowerCase()),p:await hashWithSalt(salt,p)
  }));
  document.getElementById('aPass').value='';document.getElementById('aPass2').value='';
  toast('Супер-Админ танзим шуд ✅ Акнун ворид шавед');
  renderAdminLogin();
}
let admFails=0,lockT=null;
function renderAdminLogin(){
  const li=lockInfo(),locked=li&&li.until>Date.now();
  document.getElementById('adminBody').innerHTML=`
   <button class="m-close" onclick="closeOv('ovAdmin')">✕</button>
   <div class="m-title">🔐 Вуруди Супер-Админ</div>
   ${locked?`<div class="lock-note">🔒 ҚУЛФ ШУД (Brute-Force): <span id="lockTxt"></span> интизор шавед</div>`:''}
   <input id="aLogin" placeholder="Логин" autocomplete="off" style="margin-bottom:8px">
   <input id="aPass" type="password" placeholder="Парол" autocomplete="current-password" style="margin-bottom:10px">
   <button class="btn-fill" style="width:100%;padding:12px;font-weight:700" onclick="adminLogin()" ${locked?'disabled style="opacity:.5"':''}>Ворид шавед</button>
   <div class="adm-note">Мухтасасҳо ҳеҷ гоҳ намоиш дода намешаванд — танҳо Owner медонад. 3 кӯшиши нодуруст = Қулф 15 дақиқа (экспоненсиалӣ).</div>`;
  if(locked){
    clearInterval(lockT);
    lockT=setInterval(()=>{
      const l2=lockInfo();
      if(!l2||l2.until<=Date.now()){clearInterval(lockT);renderAdminLogin();}
      else{const el=document.getElementById('lockTxt');
        if(el){const s=Math.ceil((l2.until-Date.now())/1000);el.textContent=`${Math.floor(s/60)}д ${s%60}с`;}}
    },1000);
  }
}
async function adminLogin(){
  const li=lockInfo();
  if(li&&li.until>Date.now()){toast('Қулф шуд — интизор шавед');return;}
  const st=getAdmin();if(!st){renderAdminSetup();return;}
  const l=document.getElementById('aLogin').value.trim().toLowerCase();
  const p=document.getElementById('aPass').value;
  const okL=await hashWithSalt(st.s,l)===st.l, okP=await hashWithSalt(st.s,p)===st.p;
  if(okL&&okP){
    admFails=0;localStorage.removeItem(LOCK_KEY);
    document.getElementById('aPass').value='';
    adminSession=true;
    closeOv('ovAdmin');
    PSEC=0;APATH=[];
    renderPanel();
    document.getElementById('ovPanel').classList.add('open');
    toast('Хуш омадед, Супер-Админ! 🔐');
  }else{
    admFails++;
    document.getElementById('aPass').value='';
    if(admFails>=3){
      const mins=15*Math.pow(2,admFails-3);
      localStorage.setItem(LOCK_KEY,JSON.stringify({until:Date.now()+mins*60000}));
      toast(`ҚУЛФ ШУД! ${mins} дақиқа интизор шавед 🔒`);
    }else{
      toast(`Логин ё парол нодуруст — кӯшиши ${admFails}/3`);
    }
    renderAdminLogin();
  }
}

const ADMIN_ICONS=['📦','🏠','🚗','📱','💻','🧸','👗','📺','🛋️','🔨','🎸','🐾','🛠️','🏬','🎁','🏢','💼','⭐','🎧','🚕','🌿','📚','🍕','⚽'];
const ADMIN_COLORS=['#A62626','#D94141','#1B873F','#1565C0','#6A1B9A','#E65100','#00838F','#37474F'];
function askNodeStyle(curIc,curCo){
  return new Promise(res=>{
    let ic=curIc&&ADMIN_ICONS.includes(curIc)?curIc:ADMIN_ICONS[0];
    let co=curCo&&ADMIN_COLORS.includes(curCo)?curCo:ADMIN_COLORS[0];
    const ov=document.createElement('div');ov.className='ov open';ov.style.zIndex='600';
    ov.innerHTML=`<div class="modal" style="max-width:440px">
      <div class="m-title">🎨 Иконка ва ранг</div>
      <div class="sw">${ADMIN_ICONS.map(x=>`<button class="emb" style="width:40px;height:40px;font-size:18px;${ic===x?'border-color:var(--text)':''}" data-ic="${x}">${x}</button>`).join('')}</div>
      <div class="sw">${ADMIN_COLORS.map(c=>`<button class="swb" style="background:${c};${co===c?'border-color:var(--text)':''}" data-co="${c}"></button>`).join('')}</div>
      <div class="wiz-nav"><button class="btn-out" id="stNo">Бекор</button><button class="btn-fill" id="stOk">OK</button></div></div>`;
    document.body.appendChild(ov);
    ov.querySelectorAll('[data-ic]').forEach(b=>b.onclick=()=>{ic=b.dataset.ic;ov.querySelectorAll('[data-ic]').forEach(x=>x.style.borderColor=x===b?'var(--text)':'transparent');});
    ov.querySelectorAll('[data-co]').forEach(b=>b.onclick=()=>{co=b.dataset.co;ov.querySelectorAll('[data-co]').forEach(x=>x.style.borderColor=x===b?'var(--text)':'transparent');});
    const done=v=>{ov.remove();res(v);};
    ov.querySelector('#stOk').onclick=()=>done({ic,co});
    ov.querySelector('#stNo').onclick=()=>done(null);
    ov.addEventListener('click',e=>{if(e.target===ov)done(null);});
  });
}

async function doChangeCreds(){
  const st=getAdmin();
  const cur=document.getElementById('cCur').value;
  if(await hashWithSalt(st.s,cur)!==st.p){toast('Пароли ҷорӣ нодуруст ❌');return;}
  const nl=document.getElementById('cLogin').value.trim();
  const np=document.getElementById('cPass').value,np2=document.getElementById('cPass2').value;
  if(nl.length<4||np.length<8){toast('Логин ≥4 ва парол ≥8 аломат');return;}
  if(np!==np2){toast('Паролҳо мувофиқ нестанд');return;}
  const salt=randSalt();
  localStorage.setItem(ADMIN_KEY,JSON.stringify({
    s:salt,l:await hashWithSalt(salt,nl.toLowerCase()),p:await hashWithSalt(salt,np)
  }));
  ['cCur','cPass','cPass2'].forEach(id=>document.getElementById(id).value='');
  closeOv('ovAdmin');
  reopenPanel();
  toast('Логин ва парол иваз шуд ✅ (salt ва hash-и нав)');
}

/* ---------- ёрирасон: Dialog-и матн (бе alert/prompt) ---------- */
function askText(title,initial=''){
  return new Promise(res=>{
    const ov=document.createElement('div');ov.className='ov open';ov.style.zIndex='600';
    ov.innerHTML=`<div class="modal" style="max-width:420px">
      <div class="m-title">${esc(title)}</div>
      <input id="askIn" value="${esc(initial)}">
      <div class="wiz-nav"><button class="btn-out" id="askNo">Бекор</button><button class="btn-fill" id="askOk">OK</button></div></div>`;
    document.body.appendChild(ov);
    const done=v=>{ov.remove();res(v);};
    ov.querySelector('#askOk').onclick=()=>done(ov.querySelector('#askIn').value.trim());
    ov.querySelector('#askNo').onclick=()=>done(null);
    ov.addEventListener('click',e=>{if(e.target===ov)done(null);});
    ov.addEventListener('keydown',e=>{if(e.key==='Enter')done(ov.querySelector('#askIn').value.trim());});
    setTimeout(()=>ov.querySelector('#askIn').focus(),50);
  });
}

/* ---------- CINEMATIC SPLASH: Таркиш ва кушоиш ---------- */
function enterApp(){
  const sp=document.getElementById('splash');
  if(!sp)return;
  // шардро дар як лаҳза сохтан (14 т игре паридашуда)
  for(let i=0;i<14;i++){
    const s=document.createElement('div');
    s.className='shard';
    const ang=Math.random()*Math.PI*2,dist=140+Math.random()*280;
    s.style.setProperty('--dx',Math.cos(ang)*dist+'px');
    s.style.setProperty('--dy',Math.sin(ang)*dist+'px');
    s.style.setProperty('--rot',(Math.random()*540-270).toFixed(0)+'deg');
    s.style.animationDelay=(Math.random()*.12)+'s';
    sp.appendChild(s);
  }
  sp.classList.add('explode');       // scale-up + blur + fade (shards flying)
  document.body.classList.add('app-zoom'); // spring-zoom-и feed дар зери он
  setTimeout(()=>{sp.remove();document.body.classList.remove('app-zoom');},850);
}
